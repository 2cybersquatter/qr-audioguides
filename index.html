<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Стартовая страница</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23007aff'/%3E%3Ctext x='50' y='60' font-size='50' text-anchor='middle' fill='white' font-family='Arial, Helvetica, sans-serif'%3ES%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" role="banner">
        <div class="clock" id="clock" aria-live="polite">--:--</div>

        <div class="controls">
          <button id="themeToggle" class="btn" title="Переключить тему" aria-label="Переключить тему">🌓</button>

          <label class="select-wrap" title="Поисковая система">
            <span class="sr-only">Поисковая система</span>
            <select id="searchEngine">
              <option value="google">Google</option>
              <option value="yandex">Яндекс</option>
              <option value="duckduckgo">DuckDuckGo</option>
            </select>
          </label>

          <button id="setBackground" class="btn" title="Установить фон">🖼️</button>
          <button id="clearBackground" class="btn" title="Сбросить фон">↺</button>

          <button id="exportBtn" class="btn" title="Экспорт настроек">⤴️</button>
          <label for="importInput" class="btn" title="Импорт настроек" tabindex="0">⤵️</label>
          <input id="importInput" type="file" accept="application/json" hidden />
        </div>
      </header>

      <main>
        <form id="searchForm" class="search" role="search">
          <input id="searchInput" type="text" placeholder="Поиск или адрес" autocomplete="off" aria-label="Строка поиска" />
          <button type="submit" class="btn primary">Найти</button>
        </form>

        <section class="bookmarks" aria-labelledby="bookmarksTitle">
          <div class="bookmarks-header">
            <h2 id="bookmarksTitle">Ярлыки</h2>
            <button id="addBookmark" class="btn">＋ Добавить</button>
          </div>
          <div id="bookmarksGrid" class="grid" role="list"></div>
        </section>
      </main>

      <input id="bgInput" type="file" accept="image/*" hidden />

      <dialog id="bookmarkDialog">
        <form method="dialog" id="bookmarkForm" class="dialog-form">
          <h3 id="dialogTitle">Ярлык</h3>
          <input type="hidden" id="bookmarkId" />
          <label>
            <span>Название</span>
            <input id="bookmarkTitle" type="text" required placeholder="Например: Новости" />
          </label>
          <label>
            <span>URL</span>
            <input id="bookmarkUrl" type="url" required placeholder="https://example.com" />
          </label>
          <div class="dialog-actions">
            <button value="cancel" class="btn">Отмена</button>
            <button id="saveBookmark" value="default" class="btn primary">Сохранить</button>
          </div>
        </form>
      </dialog>
    </div>

    <script src="./script.js" defer></script>
  </body>
</html>
